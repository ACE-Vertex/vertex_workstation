[package]
name = "vertex-workstation"
version = "0.1.0"
description = "Vertex Workstation host shell for detachable RAY and FORGE units"
authors = ["Vertex"]
edition = "2021"

[lib]
name = "vertex_workstation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
